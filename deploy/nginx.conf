server {
    listen 80;
    listen [::]:80;
    server_name dorehami.saeedghofrani.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dorehami.saeedghofrani.xyz;
    ssl_certificate /etc/letsencrypt/live/dorehami.saeedghofrani.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dorehami.saeedghofrani.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
